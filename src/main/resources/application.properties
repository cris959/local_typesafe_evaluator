spring.application.name=local-typesafe-evaluator
server.port=8008

# 1. Configuración de Spring AI para Ollama (Local)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:1.5b
spring.ai.ollama.chat.options.temperature=0.1

# 2. Mistral AI (Cloud / Vía Mistral AI starter)
spring.ai.mistralai.api-key=${MISTRAL_API_KEY}
spring.ai.mistralai.chat.options.model=open-mistral-7b
#mistral-medium-latest
spring.ai.mistralai.chat.options.temperature=0.1

# 3. Groq AI (Cloud / Vía Groq AI starter)
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.openai.chat.options.temperature=0.1